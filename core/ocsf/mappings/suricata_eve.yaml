source_format: suricata_eve
ocsf_class_uid: 2004          # Detection Finding
ocsf_category_uid: 2          # Findings
activity_id: 1
activity_name: "Create"
field_map:
  signature_id: finding_info.uid
  signature: finding_info.title
  category: finding_info.types.0
  severity: severity_id
  action: disposition
  src_ip: evidences.0.src_endpoint.ip
  src_port: evidences.0.src_endpoint.port
  dst_ip: evidences.0.dst_endpoint.ip
  dst_port: evidences.0.dst_endpoint.port
  proto: evidences.0.connection_info.protocol_name
value_maps:
  severity:                    # Suricata 1 = high ... 4 = informational -> OCSF severity_id
    1: 4
    2: 3
    3: 2
    4: 1
    default: 99                # Other
  action:
    allowed: Detected          # IDS mode: traffic passed, the sensor raised an alert
    blocked: Denied            # IPS mode: the sensor dropped it
static_fields:
  metadata.product.name: "Suricata"
  metadata.product.vendor_name: "OISF"
  metadata.version: "1.9.0"
unmapped_bucket: "unmapped"     # flow counters, app-layer records, gid/rev, sensor host land here
observable_fields:
  - evidences.0.src_endpoint.ip
  - evidences.0.dst_endpoint.ip
